services:
  postgres:
    image: postgres:16-alpine
    container_name: smdg-postgres
    environment:
      POSTGRES_USER: smdg
      POSTGRES_PASSWORD: smdg
      POSTGRES_DB: smdg
    ports:
      # 5433 côté hôte : un PostgreSQL système (postgresql-x64-18) occupe déjà
      # le 5432 de cette machine — voir docs/QUESTIONS.md Q-18. Le port
      # interne du conteneur reste 5432 (CI : service GitHub Actions).
      - "5433:5432"
    volumes:
      - smdg-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smdg"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  smdg-data:
